[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "weatheriq"
version = "1.0.0"
description = "WeatherIQ weather intelligence API, ingestion, and local ML models."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.156.8",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.5",
  "alembic==1.20.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "httpx==0.28.1",
  "pandas==3.0.6",
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "statsmodels==0.15.0",
  "joblib==1.6.0",
  "lightgbm==4.7.0",
  "shap==0.54.1",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.setuptools.package-dir]
"" = "services/api"

[tool.setuptools.packages.find]
where = ["services/api"]

[tool.pytest.ini_options]
pythonpath = ["services/api", "."]
testpaths = ["services/api/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["services/api", "ml", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"services/api/alembic/env.py" = ["E402"]

[tool.alembic]
script_location = "services/api/alembic"

[tool.vercel]
entrypoint = "services.api.app.main:app"
